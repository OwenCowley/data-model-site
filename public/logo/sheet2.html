<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#e9ecf2;padding:40px;width:1360px}
h1{font-size:20px;color:#0b1120;margin:0 0 24px}
.row{display:grid;grid-template-columns:60px 1fr 1fr 160px;gap:20px;align-items:center;margin-bottom:20px}
.tag{font-weight:700;font-size:28px;color:#3b5bdb}
.panel{height:180px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:16px}
.dark{background:#070b16;color:#fff}.light{background:#fff;color:#0b1120;border:1px solid #dde1e8}
.panel img{width:64px;height:64px}
.wm{font-size:34px;font-weight:650;letter-spacing:-.02em}
.wm span{background:linear-gradient(135deg,#4f7cff,#7c4dff);-webkit-background-clip:text;color:transparent}
.small{display:flex;gap:14px;align-items:end;justify-content:center;background:#fff;height:180px;border-radius:20px;border:1px solid #dde1e8}
.small img:nth-child(1){width:16px}.small img:nth-child(2){width:32px}.small img:nth-child(3){width:48px}
.label{font-size:13px;color:#5b6472;margin-top:-8px;margin-bottom:28px;padding-left:80px}
</style></head><body>
<h1>Data Model — combined concepts (A + C)</h1>
<div class="row"><div class="tag">1</div><div class="panel dark"><img src="mark-hybrid-1.svg"><div class="wm">data<span>model</span></div></div><div class="panel light"><img src="mark-hybrid-1.svg"><div class="wm">data<span>model</span></div></div><div class="small"><img src="mark-hybrid-1.svg"><img src="mark-hybrid-1.svg"><img src="mark-hybrid-1.svg"></div></div>
<div class="label">1 · Graph D: the D is drawn as an edge path between three entity nodes.</div>
<div class="row"><div class="tag">2</div><div class="panel dark"><img src="mark-hybrid-2.svg"><div class="wm">data<span>model</span></div></div><div class="panel light"><img src="mark-hybrid-2.svg"><div class="wm">data<span>model</span></div></div><div class="small"><img src="mark-hybrid-2.svg"><img src="mark-hybrid-2.svg"><img src="mark-hybrid-2.svg"></div></div>
<div class="label">2 · Graph D with rows: concept 1 plus the table rows from C.</div>
<div class="row"><div class="tag">3</div><div class="panel dark"><img src="mark-hybrid-3.svg"><div class="wm">data<span>model</span></div></div><div class="panel light"><img src="mark-hybrid-3.svg"><div class="wm">data<span>model</span></div></div><div class="small"><img src="mark-hybrid-3.svg"><img src="mark-hybrid-3.svg"><img src="mark-hybrid-3.svg"></div></div>
<div class="label">3 · Solid D: a white D with the linked-node graph inside it.</div>
</body></html>
